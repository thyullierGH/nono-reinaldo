<header [class.compacto]="compacto()">
  <div class="contenedor nav">
    <a href="/#inicio" class="logo" aria-label="Nono Reinaldo - Inicio">
      <img src="assets/logo.png" alt="Nono Reinaldo" width="220" height="54">
    </a>
    <nav class="menu" [class.abierto]="menuAbierto()" aria-label="Navegación principal">
      <ul>
        <li><a href="/#historia" (click)="cerrarMenu()">Historia</a></li>
        <li><a href="/#beneficios" (click)="cerrarMenu()">Por qué elegirnos</a></li>
        <li><a href="/#productos" (click)="cerrarMenu()">Productos</a></li>
        <li><a href="/#faq" (click)="cerrarMenu()">Preguntas</a></li>
      </ul>
      <a href="/#contacto" class="btn btn-oro" (click)="cerrarMenu()">Pedir presupuesto</a>
    </nav>
    <button
      class="hamburguesa"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >☰</button>
  </div>
</header>
